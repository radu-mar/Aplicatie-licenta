<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WatchF1 | Înregistrare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-mark">WF1</div>
            <div>
                <h1>WatchF1</h1>
                <p>Tablou de bord F1</p>
            </div>
        </div>

        <h2 class="auth-title">Cont nou</h2>
        <p class="auth-subtitle">Creează-ți contul pentru a accesa platforma WatchF1.</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="auth-error {% if 'succes' in messages[0]|lower %}auth-success{% endif %}">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="auth-field">
                <label for="username">Nume utilizator</label>
                <input type="text" id="username" name="username" placeholder="ex: pilotF1" required autocomplete="username" />
            </div>
            <div class="auth-field">
                <label for="email">Adresă de email</label>
                <input type="email" id="email" name="email" placeholder="ex: pilot@f1.com" required autocomplete="email" />
            </div>
            <div class="auth-field">
                <label for="password">Parolă</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />
            </div>
            <div class="auth-field">
                <label for="confirm">Confirmă parola</label>
                <input type="password" id="confirm" name="confirm" placeholder="••••••••" required autocomplete="new-password" />
            </div>
            <button type="submit" class="primary-btn auth-btn">Creează cont</button>
        </form>

        <p class="auth-switch">
            Ai deja cont? <a href="{{ url_for('login') }}">Autentifică-te</a>
        </p>
    </div>
</div>
</body>
</html>
